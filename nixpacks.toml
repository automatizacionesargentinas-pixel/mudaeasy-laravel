[phases.setup]
nixPkgs = ['php82', 'php82Extensions.pdo', 'php82Extensions.pdo_mysql', 'php82Extensions.mbstring', 'php82Extensions.xml', 'php82Extensions.curl', 'php82Extensions.gd', 'php82Extensions.zip', 'php82Extensions.tokenizer', 'php82Extensions.openssl', 'composer', 'nodejs_20', 'npm']

[phases.install]
cmds = [
  'COMPOSER_ALLOW_SUPERUSER=1 composer install --no-dev --optimize-autoloader --no-scripts --no-interaction --ignore-platform-reqs'
]

[phases.build]
cmds = [
  'php artisan config:cache || true',
  'php artisan route:cache || true'
]

[start]
cmd = 'php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'
