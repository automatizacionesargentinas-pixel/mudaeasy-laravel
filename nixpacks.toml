[phases.setup]
nixPkgs = ['php82', 'php82Extensions.pdo', 'php82Extensions.pdo_mysql', 'php82Extensions.pdo_sqlite', 'php82Extensions.mbstring', 'php82Extensions.xml', 'php82Extensions.curl', 'php82Extensions.gd', 'composer', 'nodejs_20', 'npm']

[phases.install]
cmds = ['composer install --no-dev --optimize-autoloader', 'cd frontend && npm install && npm run build']

[phases.build]
cmds = ['cp -r frontend/dist public/build', 'php artisan config:cache', 'php artisan route:cache', 'php artisan view:cache']

[start]
cmd = 'php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT'
